name: Process change proposal
description: Request a change to review ownership, reporting, cadence or team workflow.
title: "[Proposal] "
body:
  - type: markdown
    attributes:
      value: |
        Obtain the tech lead's explicit authorization before opening this issue and link it below.
        Do not recreate rejected #320/#405 or equivalent proposals without that approval.
        This is a proposal. It does not change team rules or create mandatory work.
        Adoption requires the tech lead's explicit approval, with client approval where applicable.
        Do not include credentials, private client instructions or personal data.
  - type: textarea
    id: problem
    attributes:
      label: Problem and evidence
      description: Link the current rule and dated evidence of the problem.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change and cost
      description: Explain who is affected, the time required, and alternatives.
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Prior tech-lead authorization
      description: Link the tech lead's explicit authorization to open this proposal. Approval to open is not approval to adopt.
    validations:
      required: true
