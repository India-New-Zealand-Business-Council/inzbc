name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Validate every JSON file parses.
      - name: Validate JSON
        run: python -c "import json,glob;[json.load(open(f,encoding='utf-8')) for f in glob.glob('**/*.json',recursive=True)];print('JSON valid')"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # ruff pinned: version bumps are deliberate, with any new-rule fixes in the same PR
          pip install 'ruff==0.15.22' -r apps/sip/pipeline/requirements.txt
      - name: Lint (ruff)
        run: ruff check apps
      - name: Test (pytest)
        run: pytest apps -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Free, no API key, no SaaS. Blocks the PR if a secret is committed.
      - name: Secret scan (gitleaks)
        run: docker run --rm -v "${{ github.workspace }}:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source /repo --no-git --redact

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflows (actionlint)
        run: docker run --rm -v "${{ github.workspace }}:/repo" -w /repo rhysd/actionlint:latest -color

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Report-only: surfaces broken doc links without blocking on flaky external URLs.
      - name: Check doc links (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress "./**/*.md"
          fail: false
