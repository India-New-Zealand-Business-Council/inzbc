name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # Validate every JSON file parses.
      - name: Validate JSON
        run: python -c "import json,glob;[json.load(open(f,encoding='utf-8')) for f in glob.glob('**/*.json',recursive=True)];print('JSON valid')"

  linked-issue:
    # Every PR must name the issue it delivers, so the board's "Linked pull requests" column
    # populates and the work is traceable. GitHub forms that link only from a keyword present in
    # the PR body BEFORE merge; it cannot be added afterwards. Use `Refs #NN` for partial work
    # that should not close the issue yet.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require a linked issue
        env:
          BODY: ${{ github.event.pull_request.body }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if echo "$TITLE $BODY" | grep -qiE '(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?) #[0-9]+'; then
            echo "Linked issue found."
          else
            echo "::error::No linked issue. Add 'Closes #NN' to the PR body, or 'Refs #NN' if this does not fully close it."
            exit 1
          fi

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # Install the locked resolution so a green CI run stays green: pyproject carries
          # lower bounds only, so an unrelated upstream release could otherwise change what
          # CI tests without a commit here.
          # uv is pinned too: an unpinned installer defeats the lockfile, since a future
          # uv release could change resolution or lockfile compatibility with no commit
          # here. Bump deliberately, same rule as the ruff pin.
          pip install "uv==0.8.17"
          uv sync --locked --extra dev
      - name: Lint (ruff)
        # `uv run` so every step uses the locked environment, not whatever pip left on PATH.
        run: uv run ruff check apps services scripts
      - name: Test (pytest + coverage)
        # Coverage gate at 90% (baseline is ~97%); term-missing shows the gaps on the PR log.
        run: >
          uv run pytest apps services -q
          --cov=apps --cov=services
          --cov-report=term-missing --cov-report=xml
          --cov-fail-under=90

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install deps
        run: |
          # uv is pinned too: an unpinned installer defeats the lockfile, since a future
          # uv release could change resolution or lockfile compatibility with no commit
          # here. Bump deliberately, same rule as the ruff pin.
          pip install "uv==0.8.17"
          uv sync --locked --extra dev
          pnpm install --frozen-lockfile
      # The TypeScript client is generated from the API's OpenAPI schema and never hand-written
      # (ADR-0001). Regenerating must be a no-op; if it is not, the committed types have drifted
      # from the API and the frontend is building against a contract that no longer exists.
      - name: Generated types are in sync
        run: |
          uv run pnpm run codegen
          # --porcelain, not `git diff`: it reports untracked files too, so a generated artifact
          # that was never committed still fails the check instead of passing silently.
          if [ -n "$(git status --porcelain -- schemas/openapi.json apps/fta/ui/src/api/schema.ts)" ]; then
            echo "::error::Generated types are stale — run 'pnpm run codegen' and commit the result."
            git --no-pager diff -- schemas/openapi.json apps/fta/ui/src/api/schema.ts
            git status --porcelain -- schemas/openapi.json apps/fta/ui/src/api/schema.ts
            exit 1
          fi
      - name: Lint
        run: pnpm -r --if-present lint
      - name: Typecheck
        run: pnpm -r --if-present typecheck
      - name: Test + coverage
        run: pnpm --filter @inzbc/fta-ui run coverage
      - name: Build
        run: pnpm -r --if-present build
      # Compile check only: proves the stories and Storybook config build. It does NOT run the
      # a11y addon's checks — that needs the Storybook test-runner and lands with Playwright in
      # task 1.2. Do not read a green tick here as accessibility compliance.
      - name: Build Storybook (compile check)
        run: pnpm --filter @inzbc/fta-ui run build-storybook

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Free SAST that works on private repos (CodeQL/GHAS is a paid add-on for private repos).
      # Report-only for now — tighten to blocking once the baseline is confirmed clean, the same
      # way the links job started.
      - name: Static analysis (semgrep)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" -w /src semgrep/semgrep:1.171.0 \
            semgrep scan --config p/python --config p/security-audit --error apps services \
            || echo "semgrep reported findings (report-only) — review before making this blocking"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Free, no API key, no SaaS. Blocks the PR if a secret is committed.
      - name: Secret scan (gitleaks)
        run: docker run --rm -v "${{ github.workspace }}:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source /repo --no-git --redact

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflows (actionlint)
        run: docker run --rm -v "${{ github.workspace }}:/repo" -w /repo rhysd/actionlint:latest -color

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Report-only: surfaces broken doc links without blocking on flaky external URLs.
      - name: Check doc links (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress "./**/*.md"
          fail: false
