name: CI

on:
  # `edited` matters for the linked-issue job below. Without it the default types are opened,
  # synchronize and reopened, so a PR that forgets `Closes #NN` cannot be fixed the way that job's
  # own error message tells you to: editing the body fires no event, and the job reads the body
  # from the event payload, so a re-run just replays the old one. The author had to push a commit
  # or reopen the PR. PR #143 sat red for four days on exactly this.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

# One run per PR at a time. `edited` fires on title and body changes as well, so without this a
# few quick corrections queue up several full nine-job runs, Docker build and Postgres included,
# all racing to report on the same commit. Superseded runs are cancelled rather than finished.
# `github.ref` keys per PR, so branches never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # Validate every JSON file parses.
      - name: Validate JSON
        run: python -c "import json,glob;[json.load(open(f,encoding='utf-8')) for f in glob.glob('**/*.json',recursive=True)];print('JSON valid')"

  linked-issue:
    # Every PR must name the issue it delivers, so the board's "Linked pull requests" column
    # populates and the work is traceable. GitHub forms that link only from a keyword present in
    # the PR body BEFORE merge; it cannot be added afterwards. Use `Refs #NN` for partial work
    # that should not close the issue yet.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require a linked issue
        env:
          BODY: ${{ github.event.pull_request.body }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Accepts every form GitHub itself links from: `Closes #12`, `Closes: #12`,
          # cross-repo `Closes owner/repo#12`, and the full issue URL. The leading \b stops
          # words like "encloses #5" satisfying the check.
          if echo "$TITLE $BODY" | grep -qiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?):?[[:space:]]+(([[:alnum:]._-]+/[[:alnum:]._-]+)?#[0-9]+|https?://github\.com/[^[:space:]]+/issues/[0-9]+)'; then
            echo "Linked issue found."
          else
            echo "::error::No linked issue. Add 'Closes #NN' to the PR body, or 'Refs #NN' if this does not fully close it."
            exit 1
          fi

  docker:
    # The deployable image is only as good as its last successful build. Building it here means a
    # change that breaks packaging fails on the PR rather than at deploy time, and the image is
    # smoke-tested rather than assumed to start.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t inzbc-fta:ci .
      - name: Start it and check the endpoints it must serve
        run: |
          docker run -d --name fta -p 8000:8000 inzbc-fta:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 && break
            sleep 2
          done
          echo "--- /health"
          curl -fsS http://127.0.0.1:8000/health | tee /dev/stderr | grep -q '"status":"ok"'
          echo "--- /api/fta/query returns a sourced answer"
          curl -fsS "http://127.0.0.1:8000/api/fta/query?q=wool" | grep -q '"status":"matched"'
          echo "--- an unmatched query escalates rather than returning an empty list"
          curl -fsS "http://127.0.0.1:8000/api/fta/query?q=zzzznotathing" | grep -q '"status":"no_match"'
          echo "--- the UI is served from the same origin"
          curl -fsS http://127.0.0.1:8000/ | grep -qi "<div id=\"root\""
      - name: Container logs on failure
        if: failure()
        run: docker logs fta || true

  python:
    runs-on: ubuntu-latest
    # #117's persistence tests need a real Postgres, not a mock - a mock would prove this repo
    # calls psycopg correctly, not that the optimistic-concurrency contract holds against real
    # transaction semantics. A service container needs no Docker Compose/self-hosting; GitHub
    # runs and tears it down for the job automatically.
    services:
      postgres:
        image: postgres:16.2
        env:
          POSTGRES_USER: inzbc
          POSTGRES_PASSWORD: inzbc
          POSTGRES_DB: inzbc_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://inzbc:inzbc@localhost:5432/inzbc_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # Install the locked resolution so a green CI run stays green: pyproject carries
          # lower bounds only, so an unrelated upstream release could otherwise change what
          # CI tests without a commit here.
          # uv is pinned too: an unpinned installer defeats the lockfile, since a future
          # uv release could change resolution or lockfile compatibility with no commit
          # here. Bump deliberately, same rule as the ruff pin.
          pip install "uv==0.8.17"
          uv sync --locked --extra dev
      - name: Apply database schema
        # ON_ERROR_STOP: bare psql continues past a failed statement and still exits 0, so a
        # broken schema (e.g. a later table failing to create) would leave the job green with
        # only part of schema.sql actually applied. --single-transaction: all-or-nothing, so a
        # partial apply can't leave some tables present and others missing.
        run: psql -v ON_ERROR_STOP=1 --single-transaction "$DATABASE_URL" -f database/schema.sql
      - name: Lint (ruff)
        # `uv run` so every step uses the locked environment, not whatever pip left on PATH.
        run: uv run ruff check apps services scripts
      - name: Test (pytest + coverage)
        # Coverage gate at 90% (baseline is ~97%); term-missing shows the gaps on the PR log.
        run: >
          uv run pytest apps services -q
          --cov=apps --cov=services
          --cov-report=term-missing --cov-report=xml
          --cov-fail-under=90

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install deps
        run: |
          # uv is pinned too: an unpinned installer defeats the lockfile, since a future
          # uv release could change resolution or lockfile compatibility with no commit
          # here. Bump deliberately, same rule as the ruff pin.
          pip install "uv==0.8.17"
          uv sync --locked --extra dev
          pnpm install --frozen-lockfile
      # The TypeScript client is generated from the API's OpenAPI schema and never hand-written
      # (ADR-0001). Regenerating must be a no-op; if it is not, the committed types have drifted
      # from the API and the frontend is building against a contract that no longer exists.
      - name: Generated types are in sync
        run: |
          uv run pnpm run codegen
          # --porcelain, not `git diff`: it reports untracked files too, so a generated artifact
          # that was never committed still fails the check instead of passing silently.
          if [ -n "$(git status --porcelain -- schemas/openapi.json apps/fta/ui/src/api/schema.ts)" ]; then
            echo "::error::Generated types are stale — run 'pnpm run codegen' and commit the result."
            git --no-pager diff -- schemas/openapi.json apps/fta/ui/src/api/schema.ts
            git status --porcelain -- schemas/openapi.json apps/fta/ui/src/api/schema.ts
            exit 1
          fi
      - name: Lint
        run: pnpm -r --if-present lint
      - name: Typecheck
        run: pnpm -r --if-present typecheck
      - name: Test + coverage
        # Recursive, not filtered to one package. Lint, typecheck and build already run with -r,
        # so a second UI app was linted and built but never tested: apps/comms/ui (#162) and
        # apps/sip/ui (#166) both ship failing suites while showing every check green, because
        # this step only ever ran @inzbc/fta-ui. A gate that cannot fail is not a gate.
        run: pnpm -r --if-present coverage
      - name: Build
        run: pnpm -r --if-present build
      # Compile check only: proves the stories and Storybook config build. It does NOT run the
      # a11y addon's checks — that needs the Storybook test-runner and lands with Playwright in
      # task 1.2. Do not read a green tick here as accessibility compliance.
      - name: Build Storybook (compile check)
        run: pnpm --filter @inzbc/fta-ui run build-storybook

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Free SAST that works on private repos (CodeQL/GHAS is a paid add-on for private repos).
      # Report-only for now — tighten to blocking once the baseline is confirmed clean, the same
      # way the links job started.
      - name: Static analysis (semgrep)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" -w /src semgrep/semgrep:1.171.0 \
            semgrep scan --config p/python --config p/security-audit --error apps services \
            || echo "semgrep reported findings (report-only) — review before making this blocking"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Free, no API key, no SaaS. Blocks the PR if a secret is committed.
      - name: Secret scan (gitleaks)
        run: docker run --rm -v "${{ github.workspace }}:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source /repo --no-git --redact

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflows (actionlint)
        run: docker run --rm -v "${{ github.workspace }}:/repo" -w /repo rhysd/actionlint:latest -color

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Report-only: surfaces broken doc links without blocking on flaky external URLs.
      - name: Check doc links (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress "./**/*.md"
          fail: false
