name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # Validate every JSON file parses.
      - name: Validate JSON
        run: python -c "import json,glob;[json.load(open(f,encoding='utf-8')) for f in glob.glob('**/*.json',recursive=True)];print('JSON valid')"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # Single source of truth is the root pyproject.toml; ruff stays pinned there so
          # version bumps are deliberate, with any new-rule fixes in the same PR.
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check apps services
      - name: Test (pytest + coverage)
        # Coverage gate at 90% (baseline is ~97%); term-missing shows the gaps on the PR log.
        run: >
          pytest apps services -q
          --cov=apps --cov=services
          --cov-report=term-missing --cov-report=xml
          --cov-fail-under=90

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install deps
        run: |
          pip install -e ".[dev]"
          pnpm install --frozen-lockfile
      # The TypeScript client is generated from the API's OpenAPI schema and never hand-written
      # (ADR-0001). Regenerating must be a no-op; if it is not, the committed types have drifted
      # from the API and the frontend is building against a contract that no longer exists.
      - name: Generated types are in sync
        run: |
          pnpm run codegen
          # --porcelain, not `git diff`: it reports untracked files too, so a generated artifact
          # that was never committed still fails the check instead of passing silently.
          if [ -n "$(git status --porcelain -- schemas/openapi.json apps/fta/ui/src/api/schema.ts)" ]; then
            echo "::error::Generated types are stale — run 'pnpm run codegen' and commit the result."
            git --no-pager diff -- schemas/openapi.json apps/fta/ui/src/api/schema.ts
            git status --porcelain -- schemas/openapi.json apps/fta/ui/src/api/schema.ts
            exit 1
          fi
      - name: Lint
        run: pnpm -r --if-present lint
      - name: Typecheck
        run: pnpm -r --if-present typecheck
      - name: Test + coverage
        run: pnpm --filter @inzbc/fta-ui run coverage
      - name: Build
        run: pnpm -r --if-present build

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Free SAST that works on private repos (CodeQL/GHAS is a paid add-on for private repos).
      # Report-only for now — tighten to blocking once the baseline is confirmed clean, the same
      # way the links job started.
      - name: Static analysis (semgrep)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" -w /src semgrep/semgrep:1.171.0 \
            semgrep scan --config p/python --config p/security-audit --error apps services \
            || echo "semgrep reported findings (report-only) — review before making this blocking"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Free, no API key, no SaaS. Blocks the PR if a secret is committed.
      - name: Secret scan (gitleaks)
        run: docker run --rm -v "${{ github.workspace }}:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source /repo --no-git --redact

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflows (actionlint)
        run: docker run --rm -v "${{ github.workspace }}:/repo" -w /repo rhysd/actionlint:latest -color

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Report-only: surfaces broken doc links without blocking on flaky external URLs.
      - name: Check doc links (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress "./**/*.md"
          fail: false
