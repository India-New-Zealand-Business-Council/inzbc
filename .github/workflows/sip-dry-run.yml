name: SIP dry run (#55)

# Manual only, by design. This is NOT a SIP-184 production run: SIP-191's launch window
# (docs/sip/launch/launch-config.md) was 27-31 Jul 2026 and has expired with no re-approval on
# record, and SIP-184's fail-closed list treats an out-of-window run as a Critical stop. This
# workflow proves the collector -> capture code path against a real backend and a fixture article
# set (apps/sip/collector/data/dry_run_fixture_articles.json, clearly synthetic) - it produces
# evidence that the wiring works, not a Production Run Register entry. See
# apps/sip/collector/run_dry_run.py's module docstring for the full picture, including the two
# services/api gaps (missing GET /api/source-library, unseeded source_library) this run cannot
# exercise yet.
on:
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.2
        env:
          POSTGRES_USER: inzbc
          POSTGRES_PASSWORD: inzbc
          POSTGRES_DB: inzbc_dry_run
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://inzbc:inzbc@localhost:5432/inzbc_dry_run
      # runs.initiated_by is a NOT NULL FK to users(id) - a plain string like "gh-actions-dry-run"
      # fails the first create_run call, and a random UUID isn't enough either since the FK needs
      # a real row. This is a fixed, deterministic id for the CI-seeded dry-run user only - never
      # used outside this ephemeral, per-run Postgres service container.
      DRY_RUN_CI_USER_ID: 00000000-0000-0000-0000-000000000001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install "uv==0.8.17"
          uv sync --locked --extra dev
      - name: Apply database schema
        run: psql -v ON_ERROR_STOP=1 --single-transaction "$DATABASE_URL" -f database/schema.sql
      - name: Seed CI dry-run user
        # create_run's initiated_by FK needs a real users row - nothing else in this workflow
        # creates one, so the first create_run call would otherwise fail (see DRY_RUN_CI_USER_ID
        # above).
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -c "
            insert into users (id, name, email)
            values ('$DRY_RUN_CI_USER_ID', 'GitHub Actions dry run', 'gh-actions-dry-run@example.invalid')
            on conflict (id) do nothing;
          "
      - name: Seed source library
        # GET /api/source-library returns [] until source_library is populated - without this,
        # the dry run's source_id resolution has nothing to resolve against.
        run: uv run python scripts/seed_source_library.py
      - name: Start services/api
        run: |
          uv run uvicorn services.api.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
      - name: Run the dry run
        run: |
          uv run python -m apps.sip.collector.run_dry_run \
            --base-url http://127.0.0.1:8000 \
            --articles-file apps/sip/collector/data/dry_run_fixture_articles.json \
            --initiated-by "$DRY_RUN_CI_USER_ID" \
            --evidence-out dry_run_evidence.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sip-dry-run-evidence
          path: dry_run_evidence.json
