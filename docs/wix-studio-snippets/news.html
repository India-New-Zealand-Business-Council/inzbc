  <div class="inz-container">
    <h1 style="color: #ffffff; max-width: 18ch; margin-inline: auto;">News</h1>

<section class="inz-section" style="background-color: #ffffff; padding: clamp(3rem, 6vw, 4.5rem) 0;">

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr)); gap: 1.5rem; margin-top: 2rem;">
