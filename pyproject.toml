[build-system]
# Pinned, not floored. uv.lock fixes runtime and dev dependencies, but an unpinned build
# backend can still change how the project is built between runs.
requires = ["setuptools==79.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "inzbc"
version = "0.1.0"
description = "INZBC AI Operating System — SIP, FTA Centre, and the shared API"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "pydantic>=2.0",
  "openai>=1.0",
  # Added by ADR-0004: the API graduates from a scheduled process to a hosted service.
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  # Added for #117: the persistence adapter. Sync, matching main.py's existing `def` (not
  # `async def`) handlers - no second concurrency model to reason about. [binary] avoids
  # requiring libpq/build tools on every machine that installs this.
  "psycopg[binary]>=3.1",
  # Added for #42's GitHub sign-in: `services/api/oauth.py` calls GitHub's token and user
  # endpoints. It was already here as a dev dependency for `fastapi.testclient`, which is why the
  # import passed locally and the container would not start: the runtime image installs the
  # project dependencies only, so a dev-only package imported by a mounted router is missing
  # exactly where it matters.
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  # ruff pinned: version bumps are deliberate, with any new-rule fixes in the same PR.
  "ruff==0.16.0",
]

# B008 flags a function call in a default argument, which is how FastAPI declares a dependency:
# `def endpoint(repo: Repo = Depends(get_repo))`. The rule exists to catch a mutable default
# evaluated once at import; FastAPI resolves `Depends()` per request, so the bug it warns about
# cannot happen here. Scoped per-file rather than silenced repo-wide, so the rule still catches a
# genuine mutable default anywhere else.
[tool.ruff.lint.per-file-ignores]
"services/api/candidates.py" = ["B008"]
"services/api/comms.py" = ["B008"]
"services/api/dashboard.py" = ["B008"]
"services/api/facts.py" = ["B008"]
"services/api/registers.py" = ["B008"]
"services/api/reports.py" = ["B008"]
"services/api/runs.py" = ["B008"]
"services/api/run_authorisations.py" = ["B008"]
"services/api/session.py" = ["B008"]
"services/api/oauth.py" = ["B008"]
"services/api/source_checks.py" = ["B008"]
"services/api/source_library.py" = ["B008"]
"services/api/tests/test_session_api.py" = ["B008"]

# Explicit, because flat-layout auto-discovery sees database/, docs/ and schemas/ as
# candidate packages and refuses to guess.
[tool.setuptools.packages.find]
include = ["apps*", "services*"]

# Test discovery previously worked only by accident of layout (rootdir insertion plus
# __init__.py in every directory). Stating it makes a bare `pytest` behave like CI.
[tool.pytest.ini_options]
testpaths = ["apps", "services", "scripts"]
