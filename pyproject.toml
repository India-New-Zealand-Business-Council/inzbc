[build-system]
# Pinned, not floored. uv.lock fixes runtime and dev dependencies, but an unpinned build
# backend can still change how the project is built between runs.
requires = ["setuptools==79.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "inzbc"
version = "0.1.0"
description = "INZBC AI Operating System — SIP, FTA Centre, and the shared API"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "pydantic>=2.0",
  "openai>=1.0",
  # Added by ADR-0004: the API graduates from a scheduled process to a hosted service.
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  # Added for #117: the persistence adapter. Sync, matching main.py's existing `def` (not
  # `async def`) handlers - no second concurrency model to reason about. [binary] avoids
  # requiring libpq/build tools on every machine that installs this.
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  # Required by fastapi.testclient. It arrived transitively via openai, which made the test
  # suite depend on an unrelated package's dependency graph. Declared explicitly.
  "httpx>=0.27",
  # ruff pinned: version bumps are deliberate, with any new-rule fixes in the same PR.
  "ruff==0.16.0",
]

# B008 flags a function call in a default argument, which is FastAPI's documented way of
# declaring a dependency: `def endpoint(repo: Repo = Depends(get_repo))`. The rule exists to
# catch a mutable default evaluated once at import, but FastAPI resolves `Depends()` per
# request, so the bug it warns about cannot happen here. Restructuring to satisfy the rule
# would mean fighting the framework in the shared-contracts lane.
#
# Scoped to the routers rather than silenced repo-wide, so the rule still catches a genuine
# mutable default anywhere else.
[tool.ruff.lint.per-file-ignores]
"services/api/candidates.py" = ["B008"]
"services/api/comms.py" = ["B008"]
"services/api/runs.py" = ["B008"]

# Explicit, because flat-layout auto-discovery sees database/, docs/ and schemas/ as
# candidate packages and refuses to guess.
[tool.setuptools.packages.find]
include = ["apps*", "services*"]

# Test discovery previously worked only by accident of layout (rootdir insertion plus
# __init__.py in every directory). Stating it makes a bare `pytest` behave like CI.
[tool.pytest.ini_options]
testpaths = ["apps", "services"]
