# Local pre-commit hooks — catch problems before CI, mirroring the CI checks.
# Setup (once):  pip install pre-commit && pre-commit install
# Run on all files:  pre-commit run --all-files
#
# ruff is pinned to the same version as CI (.github/workflows/ci.yml) so local and CI agree.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff            # lint (matches `ruff check apps services`)
        args: [--fix]
      - id: ruff-format     # format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks        # secret scan, mirrors the CI security job
