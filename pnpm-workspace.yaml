packages:
  - "apps/*/ui"

# Patch vulnerable transitive dependencies without changing their major versions.
# Keep these floors until upstream dependencies require patched releases themselves.
overrides:
  "brace-expansion@^2.0.0": 2.1.7
  "brace-expansion@^5.0.0": 5.0.12
  "js-yaml@^4.0.0": 4.3.2
  "undici@^7.0.0": 7.30.1
  "nanoid@^3.0.0": 3.3.18
  "source-map-js@^1.0.0": 1.2.2
  # zod, glob and minimatch: the advisory's only patched version crosses a major bump (no
  # patched release exists on the older major), so these are forced across every requesting
  # range rather than scoped to one, unlike the floors above.
  "zod": 4.6.7
  "glob": 14.0.2
  "minimatch@^10.0.0": 11.0.1
